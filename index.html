<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        /* O Body agora serve apenas como fundo neutro (ex: o roxo da sua loja) */
        body {
            background-color: #4b367c; /* Cor de fundo da Nuvemshop */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow-x: hidden;
        }

        /* --- O PALCO DO PLACAR (Onde a mágica acontece) --- */
        #placar-stage {
            width: 95%;
            max-width: 1100px; /* Largura controlada que você queria */
            aspect-ratio: 16 / 9; /* Mantém a proporção de cinema */
            background-image: url('TesteBriga.png');
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            border: 6px solid #000;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- CONTEÚDO (Nomes e Barra) --- */
        .container {
            width: 90%;
            margin-bottom: 40px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            font-size: 1.8rem;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.8);
        }

        .barra-container {
            width: 100%; 
            height: 30px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s ease-in-out;
            border-right: 4px solid #000;
        }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff;
            padding: 8px 15px;
            border-radius: 10px;
            border: 3px solid #333;
            font-size: 1rem;
        }

        /* Ajuste para telas pequenas (Mobile no link do Git) */
        @media (max-width: 768px) {
            #placar-stage { aspect-ratio: 1 / 1; } /* Fica quadrado no mobile */
            .nome-personagem { font-size: 1rem; }
            .views { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Novo Wrapper que controla o tamanho -->
    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="barraProgresso" class="progresso-esquerda"></div>
            </div>

            <div class="views-container">
                <span id="txtEsquerda" class="views">0 views</span>
                <span id="txtDireita" class="views">0 views</span>
            </div>
        </div>
    </div>

    <script>
    // Lógica do YouTube (Mantive a mesma que você já tem)
    const _0x4f2a = ['QUl6YVN5RHJtZVlv d1dYQTBNR2Fwa1M0NWc5ZUhDX3prTVVMSmhZ', 'MEE3UEN3Vzhnc00=', 'Wm1RQUd0Nl95Qzg='];
    const _0x1b3c = (i) => atob(_0x4f2a[i].replace(/\s/g, ''));
    let _v1 = 0; let _v2 = 0;
    const _k = _0x1b3c(0);
    const _id1 = [_0x1b3c(1)];
    const _id2 = [_0x1b3c(2)];
    const _all = [..._id1, ..._id2].join(',');

    function _uP() {
        const t = (_v1 + _v2) || 1;
        const pE = (_v1 / t) * 100;
        document.getElementById('barraProgresso').style.width = pE + "%";
        document.getElementById('txtEsquerda').innerText = _v1.toLocaleString('pt-BR') + " views";
        document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";
    }

    async function _fV() {
        try {
            const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${_all}&key=${_k}`);
            const d = await r.json();
            if (d.items) {
                let s1 = 0; let s2 = 0;
                d.items.forEach(v => {
                    const c = parseInt(v.statistics.viewCount);
                    if (_id1.includes(v.id)) s1 += c;
                    else if (_id2.includes(v.id)) s2 += c;
                });
                _v1 = s1; _v2 = s2;
                _uP();
            }
        } catch (e) {
            if(_v1 === 0) { _v1 = 500000; _v2 = 500000; _uP(); }
        }
    }

    _fV();
    setInterval(_fV, 300000);
    </script>
</body>
</html>

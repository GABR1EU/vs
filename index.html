<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center; 
            min-height: 100vh;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        /* --- PALCO DO PLACAR --- */
        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
        }

        /* CONFIGURAÇÃO DESKTOP (PC) */
        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 16 / 9;
                background-image: url('TesteBriga.png');
                background-size: contain;
            }
            .container { margin-bottom: 25px; } 
            .nome-personagem { font-size: 2.2rem; }
        }

        /* CONFIGURAÇÃO CELULAR (MOBILE) */
        @media (max-width: 768px) {
            body { align-items: flex-start; } 
            #placar-stage {
                width: 100% !important; 
                height: 100vh;
                aspect-ratio: auto; 
                background-image: url('TesteBrigaMobile.png');
                background-size: 100% auto;
                background-position: top center;
                border-radius: 0;
                padding-top: 20px; 
            }
            .container { 
                width: 95% !important; /* Espalha bem no mobile */
                margin-bottom: 25px;
            }
            .nome-personagem { 
                font-family: 'Impact', sans-serif; 
                font-size: 1.1rem; 
                -webkit-text-stroke: 0.5px #000; 
                width: 48%;
            }
            .barra-container { height: 28px !important; }
            .views { font-size: 0.8rem !important; padding: 6px 12px !important; }
        }

        /* --- ESTILOS GERAIS (BUG CORRIGIDO AQUI) --- */
        .container {
            width: 90%; /* ISSO IMPEDE QUE OS NOMES E A BARRA GRUDEM NO MEIO */
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            width: 48%; /* Dá metade da tela pra cada lado */
            text-align: center;
        }

        /* BARRA COM BRILHO E LISTRAS */
        .barra-container {
            width: 100%; 
            height: 38px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .barra-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 4px solid #000;
            position: relative;
            z-index: 5;
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%, transparent 100%);
            background-size: 40px 40px;
            opacity: 0;
            z-index: 6;
        }

        /* ANIMAÇÕES */
        .modo-turbo { opacity: 1 !important; animation: moveStripes 0.3s linear infinite !important; }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 40px 0; } }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .tremer { animation: shake 0.2s infinite ease-in-out !important; }

        /* VIEWS BOX */
        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            border: 3px solid #333;
            box-shadow: 0 4px 0px #000;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        #txtEsquerda { border-color: var(--cor-esquerda); }
        #txtDireita { border-color: var(--cor-direita); }

        .views::after {
            content: '●';
            color: #ff0000;
            font-size: 0.8rem;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtEsquerda" class="views">0 views</span>
                </div>
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtDireita" class="views">0 views</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    const _0x4f2a = ['QUl6YVN5RHJtZVlv d1dYQTBNR2Fwa1M0NWc5ZUhDX3prTVVMSmhZ', 'MEE3UEN3Vzhnc00=', 'Wm1RQUd0Nl95Qzg='];
    const _0x1b3c = (i) => atob(_0x4f2a[i].replace(/\s/g, ''));
    let _v1 = 0; let _v2 = 0;
    const _k = _0x1b3c(0);
    const _id1 = [_0x1b3c(1)];
    const _id2 = [_0x1b3c(2)];

    function _uP() {
        const t = (_v1 + _v2) || 1;
        const pE = (_v1 / t) * 100;
        
        const _b = document.getElementById('barraVersus');
        const _p = document.getElementById('barraProgresso');
        const _lE = document.getElementById('listrasEsq');
        const _lD = document.getElementById('listrasDir');
        const _nE = document.getElementById('nomeEsquerda');
        const _nD = document.getElementById('nomeDireita');

        [_lE, _lD].forEach(el => el.classList.remove('modo-turbo'));
        [_b, _nE, _nD].forEach(el => el.classList.remove('tremer'));

        _p.style.width = pE + "%";

        document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";

    async function _fV() {
        try {

</script>
</body>
</html>

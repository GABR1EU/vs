<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: auto; 
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
            margin: 0;
        }

        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 2200 / 1500;
                background-image: url('ImagemDesktop.png');
                background-size: contain;
            }
            .container { margin-bottom: 25px; } 
            .nome-personagem { font-size: 2.2rem; }
        }

        @media (max-width: 768px) {
            #placar-stage {
                width: 100% !important; 
                aspect-ratio: 9 / 16; 
                background-image: url('ImagemMobile.png');
                background-size: 100% auto;
                padding-top: 10px; 
            }
            .container { width: 95% !important; margin-bottom: 25px; }
            .nome-personagem { 
                font-family: 'Impact', sans-serif !important; 
                font-size: 1.3rem !important; 
                font-weight: 900 !important;
                color: #ffffff !important; 
                -webkit-text-stroke: 1.8px #000 !important;
                text-shadow: 3px 3px 6px rgba(0,0,0,1) !important;
            }
            .barra-container { height: 28px !important; }
            .views { font-size: 0.8rem !important; padding: 6px 12px !important; color: #fff !important; }
        }

        .container {
            width: 90%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            width: 48%; 
            text-align: center;
        }

        .barra-container {
            width: 100%; 
            height: 38px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .barra-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 4px solid #000;
            position: relative;
            z-index: 5;
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent 100%);
            background-size: 40px 40px;
            opacity: 0;
            z-index: 6;
            transition: opacity 0.3s;
        }

        .modo-turbo { opacity: 1 !important; animation: moveStripes 0.6s linear infinite !important; }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 40px 0; } }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .tremer { animation: shake 0.2s infinite ease-in-out !important; }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 10px;
            border: 3px solid #333;
            box-shadow: 0 4px 0px #000;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        #txtEsquerda { border-color: var(--cor-esquerda); }
        #txtDireita { border-color: var(--cor-direita); }

        .views::after {
            content: '●';
            color: #ff0000;
            font-size: 0.8rem;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtEsquerda" class="views">0 views</span>
                </div>
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtDireita" class="views">0 views</span>
                </div>
            </div>
        </div>
    </div>

<script>
const CONFIG = {
    // Liste aqui todas as chaves que você criou
    keys: [
        'AIzaSyDTN5Xk0snwmanEc131kXFdbl9gB-lSynk', // Coloquei sua chave nova em primeiro
        'AIzaSyBjm4rr7njSItTjF_v8FQxMZJVy3xaGjHs',
        'AIzaSyD_Yg9tkciVq86UUmfqO2SRYFipaNdI_2o',
        'AIzaSyAfKLLayDtnFKz7cb80_ldHbtIh-WRRnoY',
        'AIzaSyCp-qBHGCU6dPEUpYdp3dE1sB_V81gFzL0',
        'AIzaSyB9R1ZPEbMYPzx69a3CCCMA2pAT1lFdEaE'
    ],
    principais: ['NrUluayuOK4','OHZHCgU9Y9g','YC5jGimSeNo'], 
    secundarios: ['NrUluayuOK4','YC5jGimSeNo'] 
};

let currentKeyIndex = 0;
let _v1 = parseInt(localStorage.getItem('torajo_v1')) || 0; 
let _v2 = parseInt(localStorage.getItem('torajo_v2')) || 0;

function _uP() {
    const t = (_v1 + _v2) || 1;
    const pE = (_v1 / t) * 100;
    const _b = document.getElementById('barraVersus');
    const _p = document.getElementById('barraProgresso');
    const _lE = document.getElementById('listrasEsq');
    const _lD = document.getElementById('listrasDir');
    const _nE = document.getElementById('nomeEsquerda');
    const _nD = document.getElementById('nomeDireita');

    _lE.classList.remove('modo-turbo'); _lD.classList.remove('modo-turbo');
    [_b, _nE, _nD].forEach(el => el.classList.remove('tremer'));

    if ((_v1 + _v2) > 0) {
        if (pE > 65) { _lE.classList.add('modo-turbo'); _b.classList.add('tremer'); _nD.classList.add('tremer'); }
        else if (pE < 35) { _lD.classList.add('modo-turbo'); _b.classList.add('tremer'); _nE.classList.add('tremer'); }
    }
    _p.style.width = pE + "%";
    document.getElementById('txtEsquerda').innerText = _v1.toLocaleString('pt-BR') + " views";
    document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";
}

async function _fV() {
    const API_KEY = CONFIG.keys[currentKeyIndex];
    const uniqueIds = [...new Set([...CONFIG.principais, ...CONFIG.secundarios])].join(',');
    const url = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${uniqueIds}&key=${API_KEY}`;

    try {
        const r = await fetch(url);
        const d = await r.json();
        
        if (d.error && (d.error.code === 403 || d.error.reason === 'quotaExceeded')) {
            console.warn("Chave atual esgotada, tentando próxima...");
            if (currentKeyIndex < CONFIG.keys.length - 1) {
                currentKeyIndex++;
                return _fV();
            }
            return;
        }

        if (d.items) {
            let s1 = 0; let s2 = 0;
            const viewsMap = {};
            d.items.forEach(v => { viewsMap[v.id] = parseInt(v.statistics.viewCount); });
            CONFIG.principais.forEach(id => { if (viewsMap[id]) s1 += viewsMap[id]; });
            CONFIG.secundarios.forEach(id => { if (viewsMap[id]) s2 += viewsMap[id]; });

            _v1 = s1; _v2 = s2;
            localStorage.setItem('torajo_v1', _v1);
            localStorage.setItem('torajo_v2', _v2);
            _uP();
        }
    } catch (e) { 
        console.error("Erro na conexão API."); 
    }
}

_uP();
_fV(); 
setInterval(_fV, 600000); // 15 minutos
</script>
</body>
</html>

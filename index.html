<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
        }

        /* CONFIGURAÇÃO DESKTOP */
        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 16 / 9;
                background-image: url('TesteBriga.png');
                background-size: contain;
            }
            .container { margin-bottom: 25px; } 
            .nome-personagem { font-size: 2.2rem; }
        }

        /* CONFIGURAÇÃO MOBILE */
        @media (max-width: 768px) {
            #placar-stage {
                width: 90vw;
                aspect-ratio: 9 / 16; 
                background-image: url('TesteBrigaMobile.png');
                background-size: cover;
                border-radius: 15px;
            }
            .container { 
                width: 90%;
                margin-bottom: 20px;
            }
            .nome-personagem { font-size: 1.1rem; -webkit-text-stroke: 1px #000; }
            .barra-container { height: 28px !important; }
            .views { font-size: 0.75rem; padding: 6px 12px; }
        }

        .container {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            width: 48%;
            text-align: center;
            transition: transform 0.2s ease;
        }

        /* --- BARRA COM TUDO: BRILHO, LISTRAS E TREMIDO --- */
        .barra-container {
            width: 100%; 
            height: 38px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        /* O Brilho Vidrado (z-index alto para ficar por cima) */
        .barra-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 4px solid #000;
            position: relative;
            z-index: 5;
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%, transparent 100%);
            background-size: 40px 40px;
            opacity: 0;
            z-index: 6;
        }

        /* ANIMAÇÕES */
        .modo-turbo { 
            opacity: 1 !important; 
            animation: moveStripes 0.3s linear infinite !important;
        }

        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 40px 0; } }

        /* O EFEITO DE TREMER (SHAKE) */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .tremer { 
            animation: shake 0.2s infinite ease-in-out !important; 
        }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: 0 4px 0px #000;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <span id="txtEsquerda" class="views">0 views</span>
                <span id="txtDireita" class="views">0 views</span>
            </div>
        </div>
    </div>

    <script>
    const _0x4f2a = ['QUl6YVN5RHJtZVlv d1dYQTBNR2Fwa1M0NWc5ZUhDX3prTVVMSmhZ', 'MEE3UEN3Vzhnc00=', 'Wm1RQUd0Nl95Qzg='];
    const _0x1b3c = (i) => atob(_0x4f2a[i].replace(/\s/g, ''));
    let _v1 = 0; let _v2 = 0;
    const _k = _0x1b3c(0);
    const _id1 = [_0x1b3c(1)];
    const _id2 = [_0x1b3c(2)];
    const _all = [..._id1, ..._id2].join(',');

    function _uP() {

        const _nE = document.getElementById('nomeEsquerda');

        // Reset de classes
        [_lE, _lD].forEach(el => el.classList.remove('modo-turbo'));
        [_b, _nE, _nD].forEach(el => el.classList.remove('tremer'));

    async function _fV() {

</body>
</html>

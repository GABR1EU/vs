<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: auto; 
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
            margin: 0;
        }

        /* --- ESTILOS COMPARTILHADOS DOS NOMES --- */
        .nomes-container {
            display: flex;
            justify-content: center; 
            width: 100%;
            margin-bottom: 6px;
        }

        .nome-personagem {
            width: 50%; 
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
            font-family: 'Bangers', cursive !important;
            font-weight: normal !important;
            box-sizing: border-box;
            white-space: nowrap; 
        }

        /* --- CONFIGURAÇÃO MOBILE (CELULAR) --- */
        @media (max-width: 768px) {
            #placar-stage {
                width: 100% !important; 
                aspect-ratio: 9 / 16; 
                /* LINK ATUALIZADO DO DISCORD MOBILE */
                background-image: url('https://media.discordapp.net/attachments/1506298319561953453/1506298457483382864/ImagemMobile.png?ex=6a0f12c1&is=6a0dc141&hm=79d7debe97bc80388644493f334a81cd3dd8aa21e6c777b57769661d1635db24&=&format=webp&quality=lossless&width=533&height=948'); 
                background-size: 100% auto;
                padding-top: 10px; 
            }
            .container { 
                width: 95% !important; 
                margin-bottom: 25px; 
            }
            .nome-personagem { 
                font-size: 1.6rem !important; 
                -webkit-text-stroke: 1.2px #000 !important;
                text-shadow: 2px 2px 0px rgba(0,0,0,0.8) !important;
            }
            .barra-container { height: 28px !important; }
            .views { font-size: 0.8rem !important; padding: 6px 12px !important; color: #fff !important; }
        }

        /* --- CONFIGURAÇÃO DESKTOP (PC) --- */
        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 2200 / 1500;
                /* LINK ATUALIZADO DO DISCORD DESKTOP */
                background-image: url('https://media.discordapp.net/attachments/1506298319561953453/1506298444564660414/ImagemDesktop.png?ex=6a0f12be&is=6a0dc13e&hm=645ad69b9227ecd87e8affbe092cb60f397f8101b95af7a2f4544fc2644c4757&=&format=webp&quality=lossless&width=1376&height=938'); 
                background-size: contain;
            }
            .container { margin-bottom: 25px; } 
            .nome-personagem { 
                font-size: 3rem !important; 
                -webkit-text-stroke: 2px #000 !important;
                text-shadow: 3px 3px 0px rgba(0,0,0,0.8) !important;
            }
        }

        /* --- RESTRUTURAÇÃO DAS BARRAS E ANIMAÇÕES --- */
        .container {
            width: 90%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .barra-container {
            width: 100%; 
            height: 38px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .barra-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 30; 
            pointer-events: none;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 4px solid #000;
            position: relative;
            z-index: 20; 
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent 100%);
            background-size: 40px 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .listras-esquerda { z-index: 21; } 
        .listras-direita { z-index: 5; top: 0; left: 0; } 

        .modo-turbo { opacity: 1 !important; animation: moveStripes 0.6s linear infinite !important; }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 40px 0; } }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .tremer { animation: shake 0.2s infinite ease-in-out !important; }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 10px;
            border: 3px solid #333;
            box-shadow: 0 4px 0px #000;
            font-size: 1.1rem;
            font-family: 'Arial Black', Gadget, sans-serif !important; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        #txtEsquerda { border-color: var(--cor-esquerda); }
        #txtDireita { border-color: var(--cor-direita); }

        .views::after {
            content: '●';
            color: #ff0000;
            font-size: 0.8rem;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtEsquerda" class="views">0 views</span>
                </div>
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtDireita" class="views">0 views</span>
                </div>
            </div>
        </div>
    </div>

<script>
let _v1 = parseInt(localStorage.getItem('torajo_v1')) || 0; 
let _v2 = parseInt(localStorage.getItem('torajo_v2')) || 0;

function _uP() {
    const t = (_v1 + _v2) || 1;
    const pE = (_v1 / t) * 100;
    const _b = document.getElementById('barraVersus');
    const _p = document.getElementById('barraProgresso');
    const _lE = document.getElementById('listrasEsq');
    const _lD = document.getElementById('listrasDir');
    const _nE = document.getElementById('nomeEsquerda');
    const _nD = document.getElementById('nomeDireita');

    _lE.classList.remove('modo-turbo'); _lD.classList.remove('modo-turbo');
    [_b, _nE, _nD].forEach(el => el.classList.remove('tremer'));

    if ((_v1 + _v2) > 0) {
        if (pE > 55) { _lE.classList.add('modo-turbo'); _b.classList.add('tremer'); _nD.classList.add('tremer'); }
        else if (pE < 45) { _lD.classList.add('modo-turbo'); _b.classList.add('tremer'); _nE.classList.add('tremer'); }
    }
    
    _p.style.width = pE + "%";
    document.getElementById('txtEsquerda').innerText = _v1.toLocaleString('pt-BR') + " views";
    document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";
}

async function atualizarPlacar() {
    try {
        const r = await fetch('/api/get-views');
        const data = await r.json();
        
        if (data.v1 && data.v2) {
            _v1 = data.v1;
            _v2 = data.v2;
            localStorage.setItem('torajo_v1', _v1);
            localStorage.setItem('torajo_v2', _v2);
            _uP();
        }
    } catch (e) { 
        console.error("Erro ao buscar dados do servidor, usando cache local.");
        _uP(); 
    }
}

_uP();
atualizarPlacar();
// Configurado para buscar dados na Vercel a cada 5 minutos (evita estourar requisições!)
setInterval(atualizarPlacar, 300000); 
</script>
</body>
</html>

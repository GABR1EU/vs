<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        /* --- PALCO DO PLACAR --- */
        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
        }

        /* CONFIGURAÇÃO PARA PC (DESKTOP) */
        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 16 / 9;
                background-image: url('TesteBriga.png');
                background-size: contain;
            }
            .container { margin-bottom: 20px; } /* Bar desce mais no PC */
            .nome-personagem { font-size: 2.2rem; }
        }

        /* CONFIGURAÇÃO PARA CELULAR (MOBILE) */
        @media (max-width: 768px) {
            #placar-stage {
                width: 90vw; /* Não ocupa a tela toda nas laterais */
                aspect-ratio: 9 / 16; /* Proporção vertical */
                background-image: url('TesteBrigaMobile.png');
                background-size: cover;
                border-radius: 15px; /* Bordas arredondadinhas no mobile */
            }
            .container { 
                width: 90%;
                margin-bottom: 15px; /* Barra bem em baixo no mobile */
            }
            .nome-personagem { font-size: 1.1rem; -webkit-text-stroke: 1px #000; }
            .barra-container { height: 25px; border-width: 3px; }
            .views { font-size: 0.75rem; padding: 6px 12px; }
        }

        /* --- ESTILOS GERAIS DA BARRA --- */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 5px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
        }

        .barra-container {
            width: 100%; 
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 3px solid #000;
            position: relative;
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent 100%);
            background-size: 30px 30px;
            opacity: 0;
        }

        .modo-turbo { opacity: 1 !important; animation: moveStripes 0.3s linear infinite !important; }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 30px 0; } }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
        }

        .views {
            background: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 0 3px 0px #000;
        }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <span id="txtEsquerda" class="views">0 views</span>
                <span id="txtDireita" class="views">0 views</span>
            </div>
        </div>
    </div>

    <script>
    // Mantive sua lógica original do YouTube
    const _0x4f2a = ['QUl6YVN5RHJtZVlv d1dYQTBNR2Fwa1M0NWc5ZUhDX3prTVVMSmhZ', 'MEE3UEN3Vzhnc00=', 'Wm1RQUd0Nl95Qzg='];
    const _0x1b3c = (i) => atob(_0x4f2a[i].replace(/\s/g, ''));
    let _v1 = 0; let _v2 = 0;
    const _k = _0x1b3c(0);
    const _id1 = [_0x1b3c(1)];
    const _id2 = [_0x1b3c(2)];
    const _all = [..._id1, ..._id2].join(',');

    function _uP() {
        const t = (_v1 + _v2) || 1;
        const pE = (_v1 / t) * 100;
        document.getElementById('barraProgresso').style.width = pE + "%";
        document.getElementById('txtEsquerda').innerText = _v1.toLocaleString('pt-BR') + " views";
        document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";
    }

    async function _fV() {
        try {
            const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${_all}&key=${_k}`);
            const d = await r.json();
            if (d.items) {
                let s1 = 0; let s2 = 0;
                d.items.forEach(v => {
                    const c = parseInt(v.statistics.viewCount);
                    if (_id1.includes(v.id)) s1 += c;
                    else if (_id2.includes(v.id)) s2 += c;
                });
                _v1 = s1; _v2 = s2;
                _uP();
            }
        } catch (e) {
            if(_v1 === 0) { _v1 = 500000; _v2 = 500000; _uP(); }
        }
    }
    _fV();
    setInterval(_fV, 300000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: auto; 
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
            margin: 0;
        }

        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 2200 / 1500;
                background-image: url('ImagemDesktop.png');
                background-size: contain;
            }
            .container { margin-bottom: 25px; } 
            .nome-personagem { font-size: 2.2rem; }
        }

        @media (max-width: 768px) {
            #placar-stage {
                width: 100% !important; 
                aspect-ratio: 9 / 16; 
                background-image: url('ImagemMobile.png');
                background-size: 100% auto;
                padding-top: 10px; 
            }
            .container { width: 95% !important; margin-bottom: 25px; }
            .nome-personagem { 
                font-family: 'Impact', sans-serif !important; 
                font-size: 1.3rem !important; 
                font-weight: 900 !important;
                color: #ffffff !important; 
                -webkit-text-stroke: 1.8px #000 !important;
                text-shadow: 3px 3px 6px rgba(0,0,0,1) !important;
            }
            .barra-container { height: 28px !important; }
            .views { font-size: 0.8rem !important; padding: 6px 12px !important; color: #fff !important; }
        }

        .container {
            width: 90%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .nomes-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 8px;
        }

        .nome-personagem {
            color: #ffffff;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8);
            width: 48%; 
            text-align: center;
        }

        .barra-container {
            width: 100%; 
            height: 38px;
            background-color: var(--cor-direita);
            border: 4px solid #000;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .barra-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 30; 
            pointer-events: none;
        }

        .progresso-esquerda {
            height: 100%;
            width: 50%; 
            background-color: var(--cor-esquerda);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-right: 4px solid #000;
            position: relative;
            z-index: 20; 
        }

        .listras-esquerda, .listras-direita {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent 100%);
            background-size: 40px 40px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .listras-esquerda { z-index: 21; } 
        .listras-direita { z-index: 5; top: 0; left: 0; } 

        .modo-turbo { opacity: 1 !important; animation: moveStripes 0.6s linear infinite !important; }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 40px 0; } }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.1deg); }
            50% { transform: translate(-1px, 0px) rotate(-0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .tremer { animation: shake 0.2s infinite ease-in-out !important; }

        .views-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }

        .views {
            background: #1a1a1a;
            color: #fff !important;
            padding: 8px 18px;
            border-radius: 10px;
            border: 3px solid #333;
            box-shadow: 0 4px 0px #000;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        #txtEsquerda { border-color: var(--cor-esquerda); }
        #txtDireita { border-color: var(--cor-direita); }

        .views::after {
            content: '●';
            color: #ff0000;
            font-size: 0.8rem;
            animation: pulse-live 1.5s infinite;
        }

        @keyframes pulse-live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>

            <div id="barraVersus" class="barra-container">
                <div id="listrasDir" class="listras-direita"></div>
                
                <div id="barraProgresso" class="progresso-esquerda">
                    <div id="listrasEsq" class="listras-esquerda"></div>
                </div>
            </div>

            <div class="views-container">
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtEsquerda" class="views">0 views</span>
                </div>
                <div style="width:48%; display:flex; justify-content:center;">
                    <span id="txtDireita" class="views">0 views</span>
                </div>
            </div>
        </div>
    </div>

<script>
const CONFIG = {
    keys: [
        'AIzaSyCmr_Zq0A4g8fCo3fwGPOo4DiN6_fPzL5E',
        'AIzaSyCmMA8EGpODiNbtFceUIbUqBHEXEOJy3-k',
        'AIzaSyCzUYiP2nAS3EswSor4h_YPsON7S7wL9RM',
        'AIzaSyBqBbOLtNu-4uEV6Q5cSwVOR5n6b1eh3Uw',
        'AIzaSyDm-qvemTMfuSYz0lWlF_YQQkyJ369UYi4',
        'AIzaSyBZl4xBbHCUxA2BqXBC6IgU1rVr90odE_w',
        'AIzaSyC_bZXmBhJnMN_V9GJkTmoZxQK1gr6aSXo',
        'AIzaSyD7GIYgA3sdo5WuiUehT6_lueTEg_NnmP0',
        'AIzaSyBX1Ki2vVSIc0AwUYBcQnSiSRXkEkGXD7Y', 
        'AIzaSyCwIc0_zxJ_pEEchsJMU-UPkK3Vj63qpNU', 
        'AIzaSyDTN5Xk0snwmanEc131kXFdbl9gB-lSynk', 
        'AIzaSyADxkRRi0MWFIgctPnaDvOSc7Nt-SHTnPQ',
        'AIzaSyCyo0u-XTJLy6DjQ5IcUW7A1OUnd7yijTU',
        'AIzaSyBjm4rr7njSItTjF_v8FQxMZJVy3xaGjHs',
        'AIzaSyD_Yg9tkciVq86UUmfqO2SRYFipaNdI_2o',
        'AIzaSyAfKLLayDtnFKz7cb80_ldHbtIh-WRRnoY',
        'AIzaSyCp-qBHGCU6dPEUpYdp3dE1sB_V81gFzL0',
        'AIzaSyB9R1ZPEbMYPzx69a3CCCMA2pAT1lFdEaE',
        'AIzaSyD_4zX_NOX78ELIzEEtGv6mkoLrHGR3wnE',
        'AIzaSyA0LrB4Z59r0dyHimM44Q6zBqg-Z9DUr3s',
        'AIzaSyA_jKHDY2rrO8F1jTmeP92Zl7Au4T4CwDk',
        'AIzaSyBgc5tVJBr46hVtEXOo7P4ygoLAjlImus0',
        'AIzaSyBptqKjhuzs8C-iGGfXl8_d4osDf0f0pEA',
        'AIzaSyBnf-IgZ0nqz8SKxQJ41YDAWMIjguONgzM',
        'AIzaSyB15bsKcp6zHUdleVF9HiU_xjF_rjHqIvY',
        'AIzaSyDFYVv7mr1i4T1DKxicv9ptZ3bITY_32gY'
    ],
    
    // FORMATO DAS LISTAS: [ { id: 'CÓDIGO', data: 'ANO-MÊS-DIA', viewsFixas: NÚMERO_STÁVEL } ]
    principais: [
        { id: 'j-rlc0o6ILA', data: '2026-05-16', viewsFixas: 300000 },
        { id: 'aP_1McdVF_4', data: '2026-05-15', viewsFixas: 250000 },
        { id: 'OHZHCgU9Y9g', data: '2026-05-12', viewsFixas: 1200000 },
        { id: '9kdYCYZtom8', data: '2026-05-17', viewsFixas: 1200000 }
        
    ],
    
    secundarios: [
        { id: '9c3wOQRGR30', data: '2026-05-16', viewsFixas: 900000 },
        { id: 'l0mNft1jFjI', data: '2026-05-14', viewsFixas: 850000 },
        { id: 'P1aI_WmkqAY', data: '2026-05-10', viewsFixas: 300000 }, // Esse já passou de 3 dias, vai usar os 890k fixos direto sem ir na API!
        { id: 'XoVvt8Ws12U', data: '2026-05-09', viewsFixas: 900000 },
        { id: '93PezDiU5vc', data: '2026-05-08', viewsFixas: 250000 }
    ],

    ambos: [
        { id: 'NrUluayuOK4', data: '2026-05-17', viewsFixas: 400000 }, // Vídeo novo que conta pros dois lados!
        { id: 'YC5jGimSeNo', data: '2026-05-16', viewsFixas: 370000 },
        { id: 'Q72h8lVbNaE', data: '2026-05-15', viewsFixas: 400000 }
    ]
};

let currentKeyIndex = 0;
let _v1 = parseInt(localStorage.getItem('torajo_v1')) || 0; 
let _v2 = parseInt(localStorage.getItem('torajo_v2')) || 0;

function _uP() {
    const t = (_v1 + _v2) || 1;
    const pE = (_v1 / t) * 100;
    const _b = document.getElementById('barraVersus');
    const _p = document.getElementById('barraProgresso');
    const _lE = document.getElementById('listrasEsq');
    const _lD = document.getElementById('listrasDir');
    const _nE = document.getElementById('nomeEsquerda');
    const _nD = document.getElementById('nomeDireita');

    _lE.classList.remove('modo-turbo'); 
    _lD.classList.remove('modo-turbo');
    [_b, _nE, _nD].forEach(el => el.classList.remove('tremer'));

    if ((_v1 + _v2) > 0) {
        if (pE > 55) { _lE.classList.add('modo-turbo'); _b.classList.add('tremer'); _nD.classList.add('tremer'); }
        else if (pE < 45) { _lD.classList.add('modo-turbo'); _b.classList.add('tremer'); _nE.classList.add('tremer'); }
    }
    
    _p.style.width = pE + "%";
    document.getElementById('txtEsquerda').innerText = _v1.toLocaleString('pt-BR') + " views";
    document.getElementById('txtDireita').innerText = _v2.toLocaleString('pt-BR') + " views";
}

async function _fV(force = false) {
    const agora = Date.now();
    const ultimaAtualizacao = parseInt(localStorage.getItem('torajo_last_sync')) || 0;
    const tempoEspera = 600000; // 10 minutos contra F5

    if (!force && (agora - ultimaAtualizacao < tempoEspera)) {
        console.log("Trava Anti-F5 ativa: Carregando dados do cache local.");
        _uP(); 
        return;
    }

    // --- MATEMÁTICA INTELIGENTE DE DATAS (CONGELAMENTO DE 3 DIAS) ---
    let somaFixaEsquerda = 0;
    let somaFixaDireita = 0;
    let idsParaChamarAPI = [];

    const tresDiasEmMs = 3 * 24 * 60 * 60 * 1000;

    // Função interna para processar cada grupo de vídeos
    function analisarVideos(lista, tipoPlacar) {
        lista.forEach(video => {
            const dataLancamento = new Date(video.data + 'T00:00:00').getTime();
            
            if (agora - dataLancamento > tresDiasEmMs) {
                // PASSOU DE 3 DIAS: Soma o valor estático direto e NÃO põe na API
                if (tipoPlacar === 'esquerda') somaFixaEsquerda += video.viewsFixas;
                if (tipoPlacar === 'direita') somaFixaDireita += video.viewsFixas;
                if (tipoPlacar === 'ambos') {
                    somaFixaEsquerda += video.viewsFixas;
                    somaFixaDireita += video.viewsFixas;
                }
            } else {
                // VÍDEO NOVO: Vai precisar consultar o YouTube
                idsParaChamarAPI.push(video.id);
            }
        });
    }

    analisarVideos(CONFIG.principais, 'esquerda');
    analisarVideos(CONFIG.secundarios, 'direita');
    analisarVideos(CONFIG.ambos, 'ambos');

    // Se NÃO houver nenhum vídeo novo precisando da API, monta o placar só com a base estável e encerra
    if (idsParaChamarAPI.length === 0) {
        _v1 = somaFixaEsquerda;
        _v2 = somaFixaDireita;
        localStorage.setItem('torajo_v1', _v1);
        localStorage.setItem('torajo_v2', _v2);
        localStorage.setItem('torajo_last_sync', agora);
        _uP();
        return;
    }

    const API_KEY = CONFIG.keys[currentKeyIndex];
    const uniqueIdsStr = [...new Set(idsParaChamarAPI)].join(',');
    const url = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${uniqueIdsStr}&key=${API_KEY}`;

    try {
        const r = await fetch(url);
        const d = await r.json();
        
        if (d.error && (d.error.code === 403 || d.error.reason === 'quotaExceeded')) {
            if (currentKeyIndex < CONFIG.keys.length - 1) {
                currentKeyIndex++;
                return _fV(force);
            }
            return;
        }

        if (d.items) {
            let s1 = somaFixaEsquerda; 
            let s2 = somaFixaDireita;
            const viewsMap = {};
            
            d.items.forEach(v => { viewsMap[v.id] = parseInt(v.statistics.viewCount); });
            
            // Soma apenas os vídeos ativos que vieram da API
            CONFIG.principais.forEach(v => { if (viewsMap[v.id]) s1 += viewsMap[v.id]; });
            CONFIG.secundarios.forEach(v => { if (viewsMap[v.id]) s2 += viewsMap[v.id]; });
            CONFIG.ambos.forEach(v => { 
                if (viewsMap[v.id]) {
                    s1 += viewsMap[v.id]; 
                    s2 += viewsMap[v.id]; 
                }
            });

            _v1 = s1; _v2 = s2;
            
            localStorage.setItem('torajo_v1', _v1);
            localStorage.setItem('torajo_v2', _v2);
            localStorage.setItem('torajo_last_sync', agora);
            
            _uP();
        }
    } catch (e) { 
        console.error("Erro na conexão API, mantendo cache."); 
        _uP(); 
    }
}

_uP();
_fV(false); 

setInterval(() => {
    _fV(true); 
}, 900000); 
</script>
</body>
</html>

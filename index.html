<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Torajo - Versus Live</title>
    <style>
        :root {
            --cor-esquerda: #2ecc71; 
            --cor-direita: #e622cc;  
        }

        body {
            background-color: transparent; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            /* REMOVIDO: align-items: center e min-height: 100vh para tirar as margens */
            align-items: flex-start; 
            min-height: auto; 
            font-family: 'Arial Black', Gadget, sans-serif;
            overflow: hidden;
        }

        #placar-stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            /* Garante que o conteúdo fique colado na base da imagem de fundo */
            justify-content: flex-end; 
            align-items: center;
            position: relative;
            background-repeat: no-repeat;
            background-position: top center;
            margin: 0;
        }

        /* CONFIGURAÇÃO DESKTOP */
        @media (min-width: 769px) {
            #placar-stage {
                max-width: 1300px; 
                aspect-ratio: 16 / 9;
                background-image: url('TesteBriga.png');
                background-size: contain;
            }
            /* Reduzi a margem inferior do container para subir o placar */
            .container { margin-bottom: 10px; } 
            .nome-personagem { font-size: 2.2rem; }
        }

        /* CONFIGURAÇÃO MOBILE */
        @media (max-width: 768px) {
            #placar-stage {
                width: 100% !important; 
                aspect-ratio: 9 / 16; 
                background-image: url('ImagemMobile.png');
                background-size: 100% auto;
                padding-top: 10px; 
            }
            .container { width: 95% !important; margin-bottom: 15px; }
            .nome-personagem { 
                font-family: 'Impact', sans-serif !important; 
                font-size: 1.3rem !important; 
                -webkit-text-stroke: 1.8px #000 !important;
                text-shadow: 3px 3px 6px rgba(0,0,0,1) !important;
            }
        }

        /* ... RESTANTE DO SEU CSS (Mantenha igual) ... */
        .container { width: 90%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .nomes-container { display: flex; justify-content: space-between; width: 100%; margin-bottom: 8px; }
        .nome-personagem { color: #ffffff; text-transform: uppercase; -webkit-text-stroke: 1.5px #000; text-shadow: 2px 2px 0px rgba(0,0,0,0.8); width: 48%; text-align: center; }
        .barra-container { width: 100%; height: 38px; background-color: var(--cor-direita); border: 4px solid #000; border-radius: 50px; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.4); }
        .progresso-esquerda { height: 100%; width: 50%; background-color: var(--cor-esquerda); transition: width 0.8s ease; border-right: 4px solid #000; position: relative; z-index: 5; }
        .views-container { display: flex; justify-content: space-between; width: 100%; margin-top: 15px; }
        .views { background: #1a1a1a; color: #fff !important; padding: 8px 18px; border-radius: 10px; border: 3px solid #333; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        #txtEsquerda { border-color: var(--cor-esquerda); }
        #txtDireita { border-color: var(--cor-direita); }
    </style>
</head>
<body>
    <div id="placar-stage">
        <div class="container">
            <div class="nomes-container">
                <span id="nomeEsquerda" class="nome-personagem">PRINCIPAIS</span>
                <span id="nomeDireita" class="nome-personagem">SECUNDÁRIOS</span>
            </div>
            <div id="barraVersus" class="barra-container">
                <div id="barraProgresso" class="progresso-esquerda"></div>
            </div>
            <div class="views-container">
                <div style="width:48%; display:flex; justify-content:center;"><span id="txtEsquerda" class="views">0 views</span></div>
                <div style="width:48%; display:flex; justify-content:center;"><span id="txtDireita" class="views">0 views</span></div>
            </div>
        </div>
    </div>
    
    <script>
        // O seu código CONFIG e a função _fV() continuam aqui...
    </script>
</body>
</html>
